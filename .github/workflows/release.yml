# ============================================================
# 纸环 PaperRing —— Windows 安装包云端构建
#
# 触发:推送 v* 标签(如 v1.0.0);也支持在 Actions 页手动触发(只出 artifact,不发 Release)。
# 流水线:构建后端 bootJar → jlink 裁剪 JRE → 组装壳资源 → Tauri 打 NSIS 安装包 → 发布。
#
# ⚠ 目录约定:本文件开发时放在 shell/.github/workflows/ 下随工程走,
#   建 GitHub 仓库时必须把它移到【仓库根目录】的 .github/workflows/release.yml
#   —— GitHub 只识别根目录的 workflows。文件内容不用改:里面所有路径都按
#   "仓库根 = paperring 工程根,shell/ 是子目录"书写。
# ============================================================

name: release-windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write # softprops/action-gh-release 创建 Release 需要

env:
  # 与 build-mac.sh 对齐:前端 npm 依赖走国内镜像(官方源在 CI 外网下也不稳定)
  npm_config_registry: https://registry.npmmirror.com
  STIRLING_FLAVOR: core

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------- 工具链(版本与 build-mac.sh 一一对应) ----------
      - name: Setup JDK 25 (Temurin)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install go-task 3.44.1 (Windows)
        shell: pwsh
        run: |
          $ver = "3.44.1"
          $zip = "$env:RUNNER_TEMP\task.zip"
          Invoke-WebRequest -Uri "https://github.com/go-task/task/releases/download/v$ver/task_windows_amd64.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath "$env:RUNNER_TEMP\task" -Force
          "$env:RUNNER_TEMP\task" | Out-File -FilePath $env:GITHUB_PATH -Append
          & "$env:RUNNER_TEMP\task\task.exe" --version

      # ---------- 1) 构建后端 bootJar(参数与 build-mac.sh 已验证组合对齐) ----------
      - name: Build bootJar (core flavor, with frontend)
        shell: pwsh
        run: |
          .\gradlew.bat :stirling-pdf:bootJar -x test -PbuildWithFrontend=true --no-daemon `
            "-Dorg.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
          Get-ChildItem app\core\build\libs\*.jar | Select-Object Name, Length

      # ---------- 2) jlink 裁剪 Windows JRE ----------
      # 模块集 = jdeps 静态分析结果 ∪ 保守补充集。
      # 为什么要补充:Spring Boot 大量用反射/SPI 服务加载,jdeps 静态扫不全;
      # 补充集是社区跑 Spring Boot 桌面化应用的常见组合,宁可 JRE 大几十 MB,
      # 也不能让用户运行时撞上 NoClassDefFoundError/缺模块。
      - name: Build trimmed JRE with jlink
        shell: pwsh
        run: |
          $jar = (Get-ChildItem app\core\build\libs\stirling-pdf-*.jar | Select-Object -First 1).FullName
          $jdepsOut = & "$env:JAVA_HOME\bin\jdeps.exe" --ignore-missing-deps --print-module-deps $jar
          Write-Host "jdeps modules: $jdepsOut"
          $extras = @(
            "java.instrument",
            "jdk.charsets",
            "jdk.localedata",
            "jdk.zipfs",
            "jdk.crypto.ec",
            "jdk.management",
            "jdk.httpserver",
            "jdk.naming.dns",
            "jdk.security.auth",
            "jdk.unsupported"
          )
          $mods = (@($jdepsOut -split "," | ForEach-Object { $_.Trim() }) + $extras | Sort-Object -Unique) -join ","
          Write-Host "jlink modules: $mods"
          & "$env:JAVA_HOME\bin\jlink.exe" `
            --add-modules $mods `
            --strip-debug --no-header-files --no-man-pages `
            --compress=zip-6 `
            --output shell\resources\jre
          & shell\resources\jre\bin\java.exe --version

      # ---------- 3) 组装壳资源(jar 改名为 app.jar,与 tauri.conf.json 的映射对齐) ----------
      - name: Stage shell resources
        shell: pwsh
        run: |
          $jar = (Get-ChildItem app\core\build\libs\stirling-pdf-*.jar | Select-Object -First 1).FullName
          Copy-Item $jar shell\resources\app.jar
          Get-ChildItem shell\resources | Select-Object Name

      # ---------- 4) 构建桌面壳(NSIS 安装包) ----------
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri CLI
        shell: pwsh
        # 用 npm 预编译版 CLI(快);等价替代:cargo install tauri-cli --version "^2" --locked(慢很多)
        run: npm install -g "@tauri-apps/cli@^2"

      - name: Build Tauri shell (NSIS)
        working-directory: shell
        shell: pwsh
        # Tauri 构建时会自动下载 NSIS 工具链;产物落在 target/release/bundle/nsis/
        run: tauri build

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: paperring-windows-installer
          path: shell/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      # ---------- 5) 发布 Release(仅打 tag 时) ----------
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: 纸环 PaperRing ${{ github.ref_name }}
          files: shell/target/release/bundle/nsis/*.exe
          fail_on_unmatched_files: true
